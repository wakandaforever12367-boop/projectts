<!DOCTYPE html>
<!DOCTYPE html>

<html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Registration Form</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #667eea, #764ba2);
        padding: 20px;
    }

    .container {
        width: 100%;
        max-width: 480px;
        background: white;
        padding: 35px;
        border-radius: 20px;
        box-shadow: 0 10px 35px rgba(0,0,0,0.2);
    }

    h2 {
        text-align: center;
        color: #333;
        margin-bottom: 10px;
    }

    .subtitle {
        text-align: center;
        color: #888;
        margin-bottom: 25px;
    }

    .input-group {
        margin-bottom: 18px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
        color: #444;
    }

    input, select, textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 9px;
        outline: none;
        font-size: 14px;
    }

    input:focus, select:focus, textarea:focus {
        border-color: #764ba2;
        box-shadow: 0 0 6px rgba(118,75,162,0.3);
    }

    textarea {
        height: 85px;
        resize: none;
    }

    .gender {
        display: flex;
        gap: 15px;
        align-items: center;
    }

    .gender label {
        display: flex;
        align-items: center;
        gap: 5px;
        font-weight: normal;
    }

    .gender input {
        width: auto;
    }

    .buttons {
        display: flex;
        gap: 12px;
        margin-top: 25px;
    }

    button {
        width: 50%;
        padding: 13px;
        border: none;
        border-radius: 9px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    .submit {
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
    }

    .reset {
        background: #eee;
        color: #333;
    }

    button:hover {
        transform: translateY(-3px);
        opacity: 0.9;
    }

    @media(max-width: 480px) {
        .container {
            padding: 25px 20px;
        }
    }
</style>


</head>

<body>

<div class="container">

    <h2>Create Account</h2>
    <p class="subtitle">Register your details below</p>

    <form id="registrationForm">

        <div class="input-group">
            <label>Full Name</label>
            <input type="text" placeholder="Enter your full name" required>
        </div>

        <div class="input-group">
            <label>Email Address</label>
            <input type="email" placeholder="Enter your email" required>
        </div>

        <div class="input-group">
            <label>Phone Number</label>
            <input type="tel" placeholder="Enter 10 digit number"
            pattern="[0-9]{10}" maxlength="10" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" placeholder="Enter password"
            minlength="8" required>
        </div>

        <div class="input-group">
            <label>Gender</label>

            <div class="gender">
                <label>
                    <input type="radio" name="gender" value="Male" required>
                    Male
                </label>

                <label>
                    <input type="radio" name="gender" value="Female">
                    Female
                </label>

                <label>
                    <input type="radio" name="gender" value="Other">
                    Other
                </label>
            </div>
        </div>

        <div class="input-group">
            <label>Country</label>

            <select required>
                <option value="">Select Country</option>
                <option>India</option>
                <option>USA</option>
                <option>UK</option>
                <option>Canada</option>
                <option>Australia</option>
            </select>
        </div>

        <div class="input-group">
            <label>Message</label>
            <textarea placeholder="Write something about yourself..."></textarea>
        </div>

        <div class="buttons">
            <button type="submit" class="submit">Register</button>
            <button type="reset" class="reset">Reset</button>
        </div>

    </form>

</div>

<script>
    const form = document.getElementById("registrationForm");

    form.addEventListener("submit", function(event) {

        event.preventDefault();

        alert("Registration Successful!");

        form.reset();

    });
</script>


</body> </html>
